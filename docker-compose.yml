# Published ports are bound to 127.0.0.1 on purpose. The bare 'HOST:CONTAINER' form listens on
# 0.0.0.0 (every interface: Wi-Fi, LAN, VPN). Docker inserts its own iptables rules, which run
# before UFW/firewalld, so a host firewall does NOT block those ports. With default credentials
# (postgres/postgres), that exposes the database to anyone on the same network.
# Loopback keeps host access (localhost:3000, psql -h localhost) and blocks other machines.
# Container-to-container traffic goes over the compose network (e.g. postgres:5432) and does
# not depend on this setting. To reach the app from another device, remove the '127.0.0.1:' prefix.
services:
  app:
    build: .
    user: node
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - '127.0.0.1:3000:3000'
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_challenge
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ecommerce_challenge']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
